<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    파비콘 — 가로등 불빛(주황 원) 아래 선 인물과, 광원 반대 방향으로 길게 늘어진
    그림자. 게임의 핵심 규칙("그림자는 항상 광원 반대편")을 아이콘 하나로 표현한다.
    자체 제작 벡터라 외부 라이선스 없음.
  -->
  <rect width="64" height="64" rx="12" fill="#0a0910" />
  <!-- 가로등 불빛 -->
  <circle cx="46" cy="16" r="7" fill="#ffb057" />
  <circle cx="46" cy="16" r="13" fill="#ffb057" opacity="0.18" />
  <!-- 광원 반대 방향(좌하단)으로 늘어진 그림자 -->
  <path d="M30 44 L20 44 L6 58 L22 58 Z" fill="#ffb057" opacity="0.22" />
  <!-- 캐릭터 실루엣 -->
  <circle cx="30" cy="28" r="6" fill="#e8e4f0" />
  <path d="M24 36 h12 v8 h-12 z" fill="#e8e4f0" />
</svg>
